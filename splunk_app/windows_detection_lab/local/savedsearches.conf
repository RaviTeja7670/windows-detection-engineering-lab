

[WDL - Windows Failed Logon Brute Force Detection]
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *

description = Detects 3 or more Windows Security EventCode 4625 failed logons from the same source IP against the same host within a 5-minute window.

counttype = number of events
quantity = 0
relation = greater than

dispatch.earliest_time = -5m
dispatch.latest_time = now

alert.track = 1
alert.suppress = 1
alert.suppress.period = 10m

action.email = 1
action.email.to = kalpaguriraviteja99@gmail.com
action.email.subject = [SOC ALERT] Windows Failed Logon Brute Force - $name$
action.email.message.alert = Windows Failed Logon Brute Force Detection was triggered. Host: $result.host$ | Source IP: $result.src_ip$ | Failed Attempts: $result.failed_attempts$ | Time Window: 5 minutes | Review the alert in Splunk.
action.email.include.results_link = 1
action.email.include.view_link = 1
action.email.include.search = 0
action.email.inline = 0
action.email.sendcsv = 0
action.email.sendpdf = 0

request.ui_dispatch_app = windows_detection_lab
request.ui_dispatch_view = search

search = index=windows_security sourcetype="XmlWinEventLog:Security" EventCode=4625 | bin _time span=5m | stats count as failed_attempts by _time host src_ip | where failed_attempts >= 3 | sort - failed_attempts

